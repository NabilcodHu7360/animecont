  - name: Frieren
    subdomain: frieren
    continuation_type: continuous
    cutoff_chapter: 81         # Season 2 finale; ch.81 = start of The Golden Land Arc
    chapter_range: [81, 147]
    pages: []

  - name: Gachiakuta
    subdomain: gachiakuta
    continuation_type: continuous
    cutoff_chapter: 89         # Season 1 finale; ch.89 = 2nd-to-last ch of Heritage Mural Arc
    # Heritage Mural mostly pre-anime (tail is post-89); the other three are fully post. Order per wiki.
    pages: [Heritage_Mural_Arc, Information_Broker_Arc, First_Job_Arc, Doll_Festival_Arc]

  - name: Hell's Paradise
    subdomain: jigokuraku       # Japanese title (Jigokuraku), NOT hells-paradise
    continuation_type: continuous
    cutoff_chapter: 90         # Season 2 finale; ch.90 ~60% through Hōrai (straddles), Departure fully post
    # Hōrai_Arc uses a macron (URL shows H%C5%8Drai). If it 404s on build, try plain "Horai_Arc".
    pages: ["Hōrai_Arc", Departure_Arc]

  - name: Chainsaw Man
    subdomain: chainsaw-man
    continuation_type: continuous
    cutoff_chapter: 53         # Reze Arc movie (latest adaptation); ch.53 = 1st ch of Intl Assassins (clean cut)
    # lowercase "arc" is intentional — matches the wiki's actual page titles (case-sensitive)
    # Part 1 tail: Intl Assassins -> Falling Devil.  Part 2 (Academy Saga): Justice Devil -> War Devil.
    pages: [International_Assassins_arc, Gun_Devil_arc, Control_Devil_arc, Justice_Devil_arc,
            Dating_Denji_arc, Falling_Devil_arc, Chainsaw_Man_Church_arc, Aging_Devil_arc, War_Devil_arc]

