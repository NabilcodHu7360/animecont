# AnimeCont series registry
# ---------------------------
# Fill ONE block per anime. The corpus builder reads this file and generates
# data/corpus/<subdomain>.md for each entry automatically. You never paste pages.
#
# Fields:
#   name              display name (free text)
#   subdomain         the "<x>" in x.fandom.com  (read it off the wiki URL)
#   continuation_type "parts"      -> manga continues as whole new parts (no trimming)
#                     "continuous" -> one ongoing story (needs cutoff_chapter)
#   cutoff_chapter    ONLY for continuous series: the chapter the anime ended on.
#                     Leave as null for "parts" series.
#   pages             exact wiki page titles to ingest (the part of the URL after
#                     /wiki/). For "parts": the post-anime part pages. For
#                     "continuous": the arc pages that BEGIN after cutoff_chapter.

series:
  - name: JoJo's Bizarre Adventure
    subdomain: jojo
    continuation_type: parts
    cutoff_chapter: null
    pages: [Steel_Ball_Run, JoJolion, The_JOJOLands]

  - name: Jujutsu Kaisen
    subdomain: jujutsu-kaisen
    continuation_type: continuous
    cutoff_chapter: 181        # Season 3 finale (mid-Culling Game)
    pages: [Culling_Game_Arc, Shinjuku_Showdown_Arc]

  - name: Demon Slayer
    subdomain: kimetsu-no-yaiba
    continuation_type: continuous
    cutoff_chapter: 157        # Infinity Castle Movie 1 — latest adaptation
    # Arc pages are stubs (~350 words total); real plot lives on per-chapter pages.
    # Final Battle Arc = Infinity Castle + Sunrise Countdown; manga ends at ch.205.
    chapter_range: [137, 205]
    pages: []

  - name: Vinland Saga
    subdomain: vinlandsaga
    continuation_type: continuous
    cutoff_chapter: 101
    chapter_range: [100, 183]
    pages: [Timeline, Thorfinn, Canute, Einar, Gudrid, Hild, Thorkell]

  - name: Solo Leveling
    subdomain: solo-leveling
    continuation_type: continuous
    cutoff_chapter: 111
    # Arc pages are thin (Premise + bullet lists only) and chapter/episode pages
    # are stubs. Real plot detail lives on entity pages — point at those instead.
    pages: [
      Sung_Jinwoo,
      Antares,
      Ashborn,
      Monarchs,
      Rulers,
      Beast_Monarch,
      Frost_Monarch,
      Christopher_Reed,
      Thomas_Andre,
      Liber,
      Cha_Hae-In,
      Go_Gunhee
    ]
    chapter_range: []

  - name: Black Clover
    subdomain: blackclover
    continuation_type: continuous
    cutoff_chapter: 270        # anime finale (movie non-canon). NB: S2 airs Oct 2026 — revisit cutoff then
    pages: [Arc_10, Arc_11]    # Arc_10 straddles 270; boundary filter trims the pre-270 part

